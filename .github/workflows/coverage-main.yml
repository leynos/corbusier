name: Coverage (main)

# CodeScene accepts `cs-coverage upload` only for analysed branches, so
# main-branch coverage is uploaded here on push. This workflow also
# advances the coverage ratchet baseline: caches saved on main are
# readable by every pull-request run, so the baseline written here is the
# one pull-request ratchet checks compare against.
#
# This is the only workflow in the repository that may touch CodeScene. It
# is not a pull-request lane, so a CodeScene CLI or service change cannot
# block a merge here; it can only delay a coverage upload. The contracts in
# tests/workflow_contracts hold both halves of that rule.
#
# `workflow_dispatch` lets the upload be re-run on demand: merges
# performed by the automerge workflow's GITHUB_TOKEN do not fire
# push-event workflows, so automerged changes to main only get
# coverage via manual dispatch.

'on':
  push:
    branches: [main]
  workflow_dispatch:

# One publisher run at a time for a ref, and never cancelled. GitHub keeps
# a single pending run per group, so a newer trigger replaces an older
# pending run, and a cancelled run would abandon both its upload and its
# baseline write. The group is keyed on the ref alone: a group that also
# varied by event would let a dispatch and a push to main run side by side
# and race on the baseline.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      PG_EMBEDDED_WORKER: /home/runner/.cargo/bin/pg_worker
      OPENSSL_NO_VENDOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
      - name: Refresh apt package index
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update
      - name: Install OpenSSL headers for CI verification
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Cache pg_worker binary
        id: cache-pg-worker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/pg_worker
          key: pg-worker-0.4.0-${{ runner.os }}
      - name: Cache PostgreSQL binaries
        id: cache-pg-binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/postgresql_embedded
            ~/.local/share/postgresql_embedded
          key: pg-binaries-${{ hashFiles('Cargo.lock') }}-${{ runner.os }}
          restore-keys: |
            pg-binaries-${{ runner.os }}-
      - name: Install PostgreSQL test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends tzdata
          if [ ! -f ~/.cargo/bin/pg_worker ]; then
            cargo install pg-embed-setup-unpriv@0.4.0 --locked
          fi
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # Reports whether the token is configured without binding it anywhere:
      # the expression is evaluated before the shell runs, so this step
      # writes `available=true` or `available=false` and the token is in no
      # `env`. The uploader is a composite action that hands its step's `env`
      # to nested steps, so the token goes to it as an input instead.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        # The ref test is what keeps `workflow_dispatch` honest: a dispatch
        # can name any branch, and CodeScene would accept that branch's
        # coverage as main's.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        # a5765019 is the floor: from it the uploader selects the CodeScene
        # CLI from a committed manifest and refuses `installer-checksum`.
        # Earlier revisions install "latest", which no longer resolves.
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
        with:
          format: lcov
          # Stated rather than left to the action's default: this being the
          # upload and not the pull-request check is the point of the split.
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
