name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A push to a pull request supersedes the run already in flight, and there is
# nothing left to learn from the superseded one. Cancellation is conditioned
# on the event so a dispatch, which has no successor waiting, always runs to
# completion. Outside a pull request the group falls back to the run id, so
# no two dispatches share a queue and neither can replace the other while it
# is pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      PG_EMBEDDED_WORKER: /home/runner/.cargo/bin/pg_worker
      OPENSSL_NO_VENDOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          install-mold: 'true'
      - name: Install frontend dependencies and browser
        run: FRONTEND_INSTALL_FLAGS=--frozen-lockfile make frontend-install
      - name: Refresh apt package index
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update
      - name: Install OpenSSL headers for CI verification
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      # The workflow contracts read `.github/workflows` and need no Rust
      # toolchain, so they run before anything is compiled and fail fast.
      - name: Workflow contracts
        run: make test-workflow-contracts
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      # Dependency audits report advisories against the whole lockfile, so a
      # newly published advisory would fail every Dependabot PR regardless of
      # content and deadlock auto-merge. The scheduled audit workflow covers
      # Dependabot merges instead.
      - name: Install cargo-audit
        if: github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm cargo-audit
      - name: Audit dependencies
        if: github.actor != 'dependabot[bot]'
        run: make audit
      - name: Frontend lint
        run: make frontend-lint
      - name: Frontend typecheck
        run: make frontend-typecheck
      - name: Frontend documentation gate
        run: make frontend-docs-check
      - name: Frontend tests
        run: make frontend-test
      - name: Frontend accessibility tests
        run: make frontend-test-a11y
      - name: Frontend localizability lint
        run: make frontend-localizability
      - name: Frontend semantic lint
        run: make frontend-semantic
      - name: Frontend e2e
        run: make frontend-e2e
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          # The dev profile builds with the Cranelift backend, so the lint suite's
          # toolchain needs rustc-codegen-cranelift too.
          cranelift: 'true'
      - name: Lint
        run: make lint
      - name: Cache pg_worker binary
        id: cache-pg-worker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/pg_worker
          key: pg-worker-0.4.0-${{ runner.os }}
      - name: Cache PostgreSQL binaries
        id: cache-pg-binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/postgresql_embedded
            ~/.local/share/postgresql_embedded
          key: pg-binaries-${{ hashFiles('Cargo.lock') }}-${{ runner.os }}
          restore-keys: |
            pg-binaries-${{ runner.os }}-
      - name: Install PostgreSQL test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends tzdata
          if [ ! -f ~/.cargo/bin/pg_worker ]; then
            cargo install pg-embed-setup-unpriv@0.4.0 --locked
          fi
      # The pull-request lane measures coverage for the ratchet alone and
      # never talks to CodeScene: coverage-main.yml uploads on push to main,
      # and the workflow contracts under tests/workflow_contracts refuse the
      # token, the uploader and the CodeScene host anywhere a pull request
      # can reach.
      - name: Test and Measure Coverage
        env:
          RUSTFLAGS: -D warnings
          GITHUB_TOKEN: ${{ github.token }}
        uses: leynos/shared-actions/.github/actions/generate-coverage@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # The ratchet reads this report and nothing else does, so it is
          # not published as an artefact.
          publish-artefact: 'false'
