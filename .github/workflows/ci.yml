name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      PG_EMBEDDED_WORKER: /home/runner/.cargo/bin/pg_worker
      OPENSSL_NO_VENDOR: "1"
      # 0.2.7 is the floor: from that release the installer takes the
      # prebuilt dylint-link path instead of building it from source,
      # which is what the estate standardised on. 0.2.8 is the current
      # release on that path.
      WHITAKER_INSTALLER_VERSION: '0.2.8'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
      - name: Install frontend dependencies and browser
        run: FRONTEND_INSTALL_FLAGS=--frozen-lockfile make frontend-install
      - name: Refresh apt package index
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update
      - name: Install OpenSSL headers for CI verification
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      - name: Format
        run: make check-fmt
      # The workflow contracts read `.github/workflows` and need no Rust
      # toolchain, so they run before anything is compiled and fail fast.
      - name: Workflow contracts
        run: make test-workflow-contracts
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      # Dependency audits report advisories against the whole lockfile, so a
      # newly published advisory would fail every Dependabot PR regardless of
      # content and deadlock auto-merge. The scheduled audit workflow covers
      # Dependabot merges instead.
      - name: Install cargo-audit
        if: github.actor != 'dependabot[bot]'
        run: cargo binstall --no-confirm cargo-audit
      - name: Audit dependencies
        if: github.actor != 'dependabot[bot]'
        run: make audit
      - name: Frontend lint
        run: make frontend-lint
      - name: Frontend typecheck
        run: make frontend-typecheck
      - name: Frontend tests
        run: make frontend-test
      - name: Frontend accessibility tests
        run: make frontend-test-a11y
      - name: Frontend localizability lint
        run: make frontend-localizability
      - name: Frontend semantic lint
        run: make frontend-semantic
      - name: Frontend e2e
        run: make frontend-e2e
      - name: Cache Whitaker installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
            ~/.local/share/whitaker
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer
      - name: Lint
        run: make lint
      - name: Cache pg_worker binary
        id: cache-pg-worker
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo/bin/pg_worker
          key: pg-worker-0.4.0-${{ runner.os }}
      - name: Cache PostgreSQL binaries
        id: cache-pg-binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/postgresql_embedded
            ~/.local/share/postgresql_embedded
          key: pg-binaries-${{ hashFiles('Cargo.lock') }}-${{ runner.os }}
          restore-keys: |
            pg-binaries-${{ runner.os }}-
      - name: Install PostgreSQL test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y --no-install-recommends tzdata
          if [ ! -f ~/.cargo/bin/pg_worker ]; then
            cargo install pg-embed-setup-unpriv@0.4.0 --locked
          fi
      # The pull-request lane measures coverage for the ratchet alone and
      # never talks to CodeScene: coverage-main.yml uploads on push to main,
      # and the workflow contracts under tests/workflow_contracts refuse the
      # token, the uploader and the CodeScene host anywhere a pull request
      # can reach.
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          # The ratchet reads this report and nothing else does, so it is
          # not published as an artefact.
          publish-artefact: 'false'
