# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
    "ANALYZE", # PostgreSQL EXPLAIN option.
    "BA",       # Mermaid identifier for Block Actions.
    "RTO",      # Recovery Time Objective abbreviation.
]

[words.corrections]

[patterns]
ignore = [
    # Inline code spans were masked by the previous dictionary snapshot; kept until the shared dictionary rules on it
    "`[^`\\n]+`",
]

[files]
exclude = []
