# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
    "ANALYZE", # PostgreSQL EXPLAIN option.
    "BA",       # Mermaid identifier for Block Actions.
    "Center",   # Azure Architecture Center publication title.
    "Flavored", # Formal GitHub Flavored Markdown product name.
    "RTO",      # Recovery Time Objective abbreviation.
]

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
]

[files]
exclude = []
